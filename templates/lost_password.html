{% extends "base.html" %}
{% block title %}Восстановление пароля{% endblock %}
{% block content %}
<h1>Восстановление пароля</h1>
{% match error %}{% when Some with (message) %}<div class="error">{{ message }}</div>{% when None %}{% endmatch %}
<form method="post" action="/lostpwd.jsp" class="form">
  <input type="hidden" name="csrf" value="{{ csrf_token }}">
  <label>Email <input name="email" type="email" required value="{{ email }}"></label>
  {% if require_captcha %}<div class="help-block"><script src="https://js.hcaptcha.com/1/api.js" async defer></script><div class="h-captcha" data-sitekey="{{ captcha_site_key }}"></div></div>{% endif %}
  <button type="submit">Отправить инструкцию</button>
</form>
{% endblock %}
