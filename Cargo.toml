[package]
name = "lorsource-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
description = "Experimental Rust/Axum port of the LOR engine core"

[dependencies]
anyhow = "1"
aes-gcm = "0.10"
askama = { version = "0.12", features = ["with-axum"] }
async-trait = "0.1"
axum = { version = "0.7", features = ["macros", "json", "form", "multipart"] }
axum-extra = { version = "0.9", features = ["cookie", "typed-header"] }
base64 = "0.22"
bcrypt = "0.15"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
html-escape = "0.2"
hmac = "0.12"
http = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
once_cell = "1"
pbkdf2 = "0.12"
pulldown-cmark = "0.10"
rand = "0.8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "ipnetwork", "json"] }
thiserror = "1"
time = { version = "0.3", features = ["macros", "serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.5", features = ["fs", "trace", "compression-gzip", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
urlencoding = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[lints.rust]
non_snake_case = "allow"
non_camel_case_types = "allow"

[lints.clippy]
module_name_repetitions = "allow"
too_many_arguments = "allow"

[dev-dependencies]
pretty_assertions = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
