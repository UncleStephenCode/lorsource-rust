{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h1>{{ title }}</h1>
<div class="tag-cloud">
{% for tag in tags %}
  <a href="/tag/{{ tag.value }}">{{ tag.value }} <small>{% match tag.counter %}{% when Some with (c) %}{{ c }}{% when None %}0{% endmatch %}</small></a>
{% endfor %}
</div>
{% endblock %}
