{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h1>{{ title }}</h1>
{% match error %}{% when Some with (e) %}<div class="error">{{ e }}</div>{% when None %}{% endmatch %}
<form method="post" action="/login_process">
  <input type="hidden" name="csrf" value="{{ csrf_token }}">
  <input type="hidden" name="redirectUrl" value="{{ redirect_url }}">
  <label>Имя/email:<br><input name="nick" size="40" required autofocus autocapitalize="off"></label>
  <label>Пароль:<br><input name="passwd" type="password" size="40" required></label>
  <div class="form-actions"><button type="submit" class="btn btn-primary">Вход</button></div>
</form>
<div style="font-size: smaller">(<a href="/register.jsp">Регистрация</a> | <a href="/lostpwd.jsp">Получить забытый пароль</a>)</div>
{% endblock %}
