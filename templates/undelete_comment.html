{% extends "base.html" %}
{% block title %}Восстановление комментария{% endblock %}
{% block content %}
<h1>Восстановление комментария</h1>
<div class="messages"><div class="comment">{{ preview_html|safe }}</div></div>
<form method=POST action="undelete_comment">
  <input type="hidden" name="csrf" value="{{ csrf_token }}">
  <input type=hidden name=msgid value="{{ comment_id }}">
  <div class="control-group">
    <button type=submit class="btn btn-primary">Восстановить</button>
  </div>
</form>
{% endblock %}
