services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lor
      POSTGRES_USER: lor
      POSTGRES_PASSWORD: lor
    ports:
      - "5432:5432"
    volumes:
      - lor_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lor -d lor"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      DATABASE_URL: postgres://lor:lor@postgres:5432/lor
      PUBLIC_URL: http://localhost:8080
      UPLOAD_DIR: /app/uploads
      SITE_SECRET: change-me-in-production-change-me-in-production
      COOKIE_SECRET: change-me-in-production-change-me-in-production
      RUST_LOG: lorsource_rust=debug,tower_http=info,sqlx=warn
      RUN_MIGRATIONS: "true"
      OPENSEARCH_URL: http://opensearch:9200
    ports:
      - "8080:8080"
    volumes:
      - lor_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy

  opensearch:
    image: opensearchproject/opensearch:3.6.0
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:9200/_cluster/health | grep -qv ''"status":"red"''']
      interval: 15s
      timeout: 10s
      retries: 10
    volumes:
      - lor_opensearch:/usr/share/opensearch/data

volumes:
  lor_pgdata:
  lor_uploads:
  lor_opensearch:
