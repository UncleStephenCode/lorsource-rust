services:
  app:
    image: ${LORSOURCE_IMAGE:?Set LORSOURCE_IMAGE to registry/repository@sha256:digest}
    read_only: true
    restart: unless-stopped
    stop_grace_period: 45s
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    environment:
      LOR_ENV: production
      LOR_HOST: 0.0.0.0
      LOR_PORT: 8181
      PUBLIC_URL: ${PUBLIC_URL:?Set the public HTTPS origin}
      WS_URL: ${WS_URL:?Set the matching public WSS origin}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:?Set the TLS proxy CIDRs}
      DATABASE_URL_FILE: /run/secrets/database_url
      SITE_SECRET_FILE: /run/secrets/site_secret
      CAPTCHA_PUBLIC_KEY: ${CAPTCHA_PUBLIC_KEY:?Set the public CAPTCHA site key}
      CAPTCHA_PRIVATE_KEY_FILE: /run/secrets/captcha_private_key
      CAPTCHA_VERIFY_URL: ${CAPTCHA_VERIFY_URL:-https://hcaptcha.com/siteverify}
      OPENSEARCH_URL: ${OPENSEARCH_URL:?Set the production OpenSearch URL}
      SMTP_HOST: ${SMTP_HOST:?Set the production MTA hostname}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_HELO_NAME: ${SMTP_HELO_NAME:?Set the production SMTP HELO name}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set the exception-report recipient}
      UPLOAD_DIR: /app/uploads
      STATIC_DIR: /app/static
      SKIP_UPLOAD_CHOWN: "true"
      TZ: ${SCHEDULER_TIMEZONE:?Set the IANA timezone used by the original Java scheduler}
      SCHEDULER_TIMEZONE: ${SCHEDULER_TIMEZONE:?Set the IANA timezone used by the original Java scheduler}
      LEGACY_JDBC_TIMEZONE: ${LEGACY_JDBC_TIMEZONE:?Set the verified IANA timezone used by the original Java JDBC runtime}
      ENABLE_HSTS: ${ENABLE_HSTS:-true}
      ENABLE_DEV_BYPASSES: "false"
      ENABLE_BACKGROUND_JOBS: ${ENABLE_BACKGROUND_JOBS:?Explicitly select true on one scheduler replica or false on passive replicas}
      CLEAN_OLD_USERPICS: ${CLEAN_OLD_USERPICS:-false}
      TELEGRAM_TOKEN: "false"
      RUST_LOG: ${RUST_LOG:-lorsource_rust=info,tower_http=info,sqlx=warn}
    ports:
      - "127.0.0.1:${LOR_PUBLISHED_PORT:-8181}:8181"
    volumes:
      - ${UPLOAD_HOST_PATH:?Set the restored media root owned by UID/GID 8181}:/app/uploads:rw,Z
      - ${DATABASE_URL_SECRET_FILE:?Set the runtime database URL secret file}:/run/secrets/database_url:ro,Z
      - ${SITE_SECRET_SOURCE:?Set the site secret file}:/run/secrets/site_secret:ro,Z
      - ${CAPTCHA_PRIVATE_KEY_SOURCE:?Set the CAPTCHA private-key file}:/run/secrets/captcha_private_key:ro,Z
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8181/readyz"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 4
