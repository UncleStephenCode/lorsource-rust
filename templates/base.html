<!doctype html>
<html lang="ru" data-style="tango-auto" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="initial-scale=1.0">
  <title>{% block title %}Linux.org.ru{% endblock %}</title>
  <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
  <link rel="preload" href="/js/lor.js" as="script">
  <link rel="yandex-tableau-widget" href="/manifest.json">
  <link rel="search" title="Search L.O.R." href="/search.jsp">
  <meta name="referrer" content="always">
  <base href="<!-- LOR_BASE_URL -->">
  <link rel="stylesheet" href="/tango/combined.css" data-lor-theme-stylesheet>
  <link rel="alternate" type="application/rss+xml" href="/rss">
  <script src="/js/script.min.js"></script>
  <script>
    $script('/webjars/jquery/3.7.1/jquery.min.js', 'jquery');

    $script.ready('jquery', function() {
      $script('/js/lor.js', 'lorjs');
      $script('/js/plugins.js', 'plugins');
    });

    $script('/js/highlight.min.js', 'hljs');
    $script.ready(['jquery', 'hljs'], function() {
      $(function() {
        hljs.initHighlighting();
      });
    });

    $script('/js/realtime.js', 'realtime');

    $script.ready('lorjs', function() {
      fixTimezone('<!-- LOR_TIMEZONE -->');
    });
  </script>
  <script>
    (function() {
      if (!document.documentElement.dataset.style.startsWith('tango')) return;
      var theme = localStorage.getItem('lor-theme');
      if (theme === 'dark' || theme === 'light' || theme === 'auto') {
        document.documentElement.setAttribute('data-theme', theme);
      }
    })();
  </script>
  {% block head_extra %}{% endblock %}
</head>
<body>
<!-- LOR_THEME_HEADER -->
<main id="bd">
  {% block content %}{% endblock %}
</main>
<!-- LOR_THEME_FOOTER -->
<script src="/js/lor/forms-and-reactions.js"></script>
</body>
</html>
