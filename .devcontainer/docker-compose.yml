version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
      - cargo-cache:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - target-cache:/workspace/target
      - rust-uploads:/workspace/uploads
    ports:
      - "127.0.0.1:8080:8080"
    command: sleep infinity
    environment:
      DATABASE_URL: postgres://lor:lor@postgres:5432/lor
      PUBLIC_URL: http://localhost:8080
      LOR_HOST: 0.0.0.0
      LOR_PORT: 8080
      STATIC_DIR: /workspace/static
      UPLOAD_DIR: /workspace/uploads
      COOKIE_SECRET: devcontainer-change-me-change-me-change-me
      SITE_SECRET: devcontainer-change-me-change-me-change-me
      OPENSEARCH_URL: http://opensearch:9200
      RUN_MIGRATIONS: "true"
      RUST_LOG: lorsource_rust=debug,tower_http=info,sqlx=warn
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: lor
      POSTGRES_USER: lor
      POSTGRES_PASSWORD: lor
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lor -d lor"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  opensearch:
    image: opensearchproject/opensearch:3.6.0
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qv '\"status\":\"red\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
    volumes:
      - opensearch-data:/usr/share/opensearch/data

volumes:
  postgres-data:
  opensearch-data:
  cargo-cache:
  cargo-git:
  target-cache:
  rust-uploads:
