{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h1>{{ title }}</h1>
{% match error %}{% when Some with (e) %}<p class="error">{{ e }}</p>{% when None %}{% endmatch %}
<form method="post" action="/login_process" class="form">
  <label>Ник <input name="nick" required></label>
  <label>Пароль <input name="passwd" type="password" required></label>
  <button type="submit">Войти</button>
</form>
{% endblock %}
