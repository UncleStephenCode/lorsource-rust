{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h1>{{ heading }}</h1>

<nav>
  <a class="btn btn-default" href="{{ back_url }}">{{ back_label }}</a>
  <a class="btn btn-selected" href="#">Архив</a>
</nav>

<div class="archive-index">
{% for m in months %}
  <p><a href="{{ m.url }}">{{ m.month_name }} {{ m.year }} года ({{ m.count }})</a></p>
{% endfor %}
{% if months.len() == 0 %}
<p class="muted">Архив пуст.</p>
{% endif %}
</div>
{% endblock %}
